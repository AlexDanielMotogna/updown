name: Secret scan

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      full_history:
        description: 'Scan the entire history instead of just the new commits'
        type: boolean
        default: false

# This repo is public. A key committed here is public the moment it is pushed,
# and rewriting history does not un-publish it (forks keep their copy). CI is
# the hard gate; the .githooks/pre-commit hook is the soft one.
#
# NOTE ON SCOPE: by default this scans only the commits introduced by the push
# or PR, not the whole history. That is deliberate. Historical findings are
# handled out of band, on their own schedule, and a job that reports them on
# every push would sit permanently red, which makes it a check nobody reads.
# Run the workflow manually with full_history=true to audit everything.

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need history to diff a commit range. 0 = everything.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.18.4
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Determine scan range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full_history }}" = "true" ]; then
            echo "log_opts=" >> "$GITHUB_OUTPUT"
            echo "Scanning FULL history."
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            echo "log_opts=--no-merges $base..HEAD" >> "$GITHUB_OUTPUT"
            echo "Scanning $base..HEAD"
          else
            before="${{ github.event.before }}"
            # All-zero SHA means a new branch or a force push with no prior ref.
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
              echo "log_opts=--no-merges -1 HEAD" >> "$GITHUB_OUTPUT"
              echo "No usable base ref; scanning the tip commit only."
            else
              echo "log_opts=--no-merges $before..HEAD" >> "$GITHUB_OUTPUT"
              echo "Scanning $before..HEAD"
            fi
          fi

      - name: Scan
        run: |
          gitleaks detect \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --exit-code 1 \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --log-opts "${{ steps.range.outputs.log_opts }}"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore

  excluded-paths:
    name: unpublished paths stay untracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if an excluded path is tracked
        run: |
          if git ls-files --error-unmatch 'docs/security/*' >/dev/null 2>&1; then
            echo "::error::A path this project does not publish is tracked in git."
            git ls-files 'docs/security/*'
            exit 1
          fi
          echo "OK."
